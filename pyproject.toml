[project]
name = "owasp-sentinel"
version = "0.1.0"
description = "Standalone OWASP Web Application Security Assessment Platform"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["B008", "E501", "E402"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_configs = true
check_untyped_defs = true

